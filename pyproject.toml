[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petforge"
version = "0.6.0"
description = "Forge a companion pet for your agent: 849 mythology companions with personality cores, a mood engine, bond levels, XP evolution, culture signature moves, and reactions to task outcomes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Priyanshu Kumar Thakur" }]
keywords = ["ai-agents", "companions", "pets", "cli", "gamification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.scripts]
petforge = "petforge.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/petforge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"petforge.data" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
